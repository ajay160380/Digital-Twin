<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Twin | TwinPro</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@900&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-dark: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Satoshi', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        h1, h2, .title-font {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
        }

        /* Vibrant Animated Background */
        .vibrant-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #f59e0b, #db2777);
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
            z-index: -2;
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Lights */
        .ambient-circle-1 {
            position: fixed; width: 500px; height: 500px; background: rgba(79, 70, 229, 0.4); /* Indigo */
            border-radius: 50%; filter: blur(100px); top: -20%; left: -10%; z-index: -1;
        }
        .ambient-circle-2 {
            position: fixed; width: 400px; height: 400px; background: rgba(245, 158, 11, 0.3); /* Amber */
            border-radius: 50%; filter: blur(80px); bottom: -10%; right: -10%; z-index: -1;
        }

        /* Glass Card */
        .glass-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: mistyReveal 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(20px);
        }

        @keyframes mistyReveal {
            to { opacity: 1; transform: scale(1); filter: blur(0px); }
        }

        .logo-circle {
            width: 48px; height: 48px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #4f46e5; margin-bottom: 24px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 8px; line-height: 1; }
        .subtitle { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 32px; }

        .field { margin-bottom: 20px; }
        .field label {
            display: block; font-size: 0.85rem; font-weight: 700;
            color: rgba(255,255,255,0.9); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .field input {
            width: 100%; padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; font-size: 1rem; color: white;
            font-family: 'Satoshi', sans-serif; transition: all 0.3s;
        }
        .field input:focus {
            outline: none; border-color: rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.4);
        }
        
        .helptext { display: block; margin-top: 6px; font-size: 0.8rem; color: rgba(255,255,255,0.5); }
        .errorlist { list-style: none; margin-top: 6px; font-size: 0.8rem; color: #f87171; background: rgba(248,113,113,0.1); padding: 8px; border-radius: 4px;}

        .btn-solid {
            width: 100%; padding: 16px; border-radius: 9999px;
            background: white; color: var(--bg-dark); border: none;
            font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.3s; margin-top: 16px;
        }
        .btn-solid:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .footer-text { text-align: center; margin-top: 32px; font-size: 0.9rem; color: rgba(255,255,255,0.7); }
        .footer-text a { color: white; text-decoration: none; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.3); transition: all 0.2s; }
        .footer-text a:hover { border-color: white; }
    </style>
</head>
<body>

    <div class="vibrant-bg"></div>
    <div class="ambient-circle-1"></div>
    <div class="ambient-circle-2"></div>

    <div class="glass-card">
        <div class="logo-circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        
        <h1 class="title-font">INITIALIZE TWIN</h1>
        <p class="subtitle">Provide seed data for your cognitive clone.</p>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text|striptags }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn-solid">CREATE PROFILE</button>
        </form>

        <div class="footer-text">
            Already exist? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>

</body>
</html>
